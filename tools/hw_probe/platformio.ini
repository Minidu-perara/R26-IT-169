; Hardware probe. Separate from the production firmware; reuses its
; BoundedDHT lib and ina219_meter.h read-only.
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_resetmethod = nodemcu
lib_extra_dirs = ../../firmware/lib

[env:nodemcuv2]
platform  = espressif8266@4.2.1
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../../firmware/lib

[env:bin02_tcptest]
platform  = espressif8266@4.2.1
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<../tcp_test/main.cpp>
