; Prepared for the common NodeMCU ESP-12E USB development board.
; Confirm the physical board/photo and port before any upload.
[env:node02_esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Dependencies are copied with their licenses into lib/ for a reproducible
; offline build: PubSubClient 2.8.0, ArduinoJson 7.4.3, local BoundedDHT.
